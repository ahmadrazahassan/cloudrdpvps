<!--
  Supabase Auth email: reauthentication
  Subject line to use:  Your confirmation code
  Paste this file into Supabase → Authentication → Email Templates → Reauthentication.
  Placeholders written in double curly braces are filled in by Supabase. The link goes through /auth/confirm on our own site, so it
  works on any device. Keep the markup inline-styled: email clients ignore <style> blocks.
-->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f1f1f1;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#121214">
    <div style="max-width:520px;margin:0 auto">
      <p style="margin:0 0 24px">
        <img src="{{ .SiteURL }}/brand/logo-black.png" width="220" height="40" alt="Cloud RDP VPS" style="display:block;border:0;max-width:100%;height:auto">
      </p>
      <div style="padding:28px;background:#ffffff;border-radius:16px">
        <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-0.01em;color:#121214">Your confirmation code</h1>
        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#3f3f46">Enter this code to confirm it's you:</p>
        <p style="margin:20px 0;padding:16px;border-radius:12px;background:#f7f7f8;text-align:center;font-size:30px;line-height:1;font-weight:600;letter-spacing:0.3em;color:#121214">{{ .Token }}</p>
      </div>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#666670">If you didn't ask for this code, someone may be using your account — reset your password.</p>
    </div>
  </body>
</html>
